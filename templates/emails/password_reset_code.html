<!-- templates/emails/password_reset_code.html -->
<!DOCTYPE html>
<html>
<head><title>Password Reset Code</title></head>
<body style="font-family: Arial; background: #f4f4f4; padding: 20px;">
    <div style="max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px;">
        <h2>Password Reset Code</h2>
        <p>Hello {{ name }},</p>
        <p>Your password reset code is:</p>
        <div style="font-size: 32px; font-weight: bold; text-align: center; padding: 20px; background: #f0f0f0; letter-spacing: 5px;">{{ code }}</div>
        <p>This code expires in {{ minutes }} minutes.</p>
    </div>
</body>
</html>
