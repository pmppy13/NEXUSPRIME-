{% extends 'broker/base.html' %}
{% block title %}Reset Link Sent{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-16 max-w-md">
    <div class="glass rounded-2xl p-8 text-center animate-fadeInUp">
        <i class="fas fa-envelope text-6xl text-green-500 mb-4"></i>
        <h1 class="text-3xl font-bold mb-4">Check Your Email</h1>
        <p class="text-gray-400 mb-2">We've sent you a link to reset your password.</p>
        <p class="text-gray-500 text-sm mb-6">Check your spam folder if you don't see it within a few minutes.</p>
        <a href="{% url 'login' %}" class="inline-block bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 px-6 py-2 rounded-lg transition">
            Return to Login
        </a>
    </div>
</div>
{% endblock %}
