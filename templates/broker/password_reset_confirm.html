{% extends 'broker/base.html' %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-16 max-w-md">
    <div class="glass rounded-2xl p-8 animate-fadeInUp">
        <div class="text-center mb-6">
            <i class="fas fa-lock text-5xl gradient-text mb-3"></i>
            <h1 class="text-3xl font-bold">Set New Password</h1>
        </div>
        
        {% if validlink %}
            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="block text-gray-300 mb-2">New Password</label>
                    <input type="password" name="new_password1" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none text-white" placeholder="Enter new password" required>
                </div>
                <div class="mb-6">
                    <label class="block text-gray-300 mb-2">Confirm Password</label>
                    <input type="password" name="new_password2" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none text-white" placeholder="Confirm new password" required>
                </div>
                <button type="submit" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 w-full py-3 rounded-lg font-semibold transition">
                    <i class="fas fa-save mr-2"></i> Reset Password
                </button>
            </form>
        {% else %}
            <div class="text-center">
                <i class="fas fa-exclamation-triangle text-6xl text-red-500 mb-4"></i>
                <p class="text-red-400 mb-4">The password reset link is invalid or has expired.</p>
                <a href="{% url 'password_reset' %}" class="inline-block bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 px-6 py-2 rounded-lg transition">
                    Request New Reset Link
                </a>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
