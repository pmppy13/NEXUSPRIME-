{% extends 'broker/base.html' %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-16 max-w-md">
    <div class="glass rounded-2xl p-8 animate-fadeInUp">
        <div class="text-center mb-6">
            <i class="fas fa-key text-5xl gradient-text mb-3"></i>
            <h1 class="text-3xl font-bold">Reset Password</h1>
            <p class="text-gray-400 mt-2">Enter your email to receive reset link</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-6">
                <label class="block text-gray-300 mb-2">Email Address</label>
                <input type="email" name="email" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none text-white" placeholder="your@email.com" required>
            </div>
            
            <button type="submit" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 w-full py-3 rounded-lg font-semibold transition">
                <i class="fas fa-paper-plane mr-2"></i> Send Reset Link
            </button>
        </form>
        
        <div class="text-center mt-6">
            <p class="text-gray-400"><a href="{% url 'login' %}" class="text-blue-400 hover:text-blue-300">Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
