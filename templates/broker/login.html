<!-- templates/broker/login.html -->
{% extends 'broker/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-16 max-w-md">
    <div class="glass rounded-2xl p-8 animate-fadeInUp">
        <div class="text-center mb-6">
            <i class="fas fa-sign-in-alt text-5xl gradient-text mb-3"></i>
            <h1 class="text-3xl font-bold">Welcome Back</h1>
            <p class="text-gray-400 mt-2">Login to your NexusPrime account</p>
        </div>
        
        <form method="POST">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-gray-300 mb-2">Username</label>
                <input type="text" name="username" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none text-white" placeholder="Enter your username" required>
            </div>
            <div class="mb-4">
                <label class="block text-gray-300 mb-2">Password</label>
                <input type="password" name="password" class="w-full px-4 py-3 rounded-xl bg-gray-800 border border-gray-700 focus:border-blue-500 focus:outline-none text-white" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 w-full py-3 rounded-lg font-semibold transition transform hover:scale-105">
                <i class="fas fa-sign-in-alt mr-2"></i> Login
            </button>
        </form>
        
        <div class="text-center mt-6">
            <a href="{% url 'password_reset' %}" class="text-blue-400 hover:text-blue-300 text-sm">Forgot Password?</a>
            <p class="text-gray-400 mt-4">Don't have an account? <a href="{% url 'signup' %}" class="text-blue-400 hover:text-blue-300">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
