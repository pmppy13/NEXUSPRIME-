{% extends 'broker/base.html' %}
{% block title %}Password Reset Complete{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-16 max-w-md">
    <div class="glass rounded-2xl p-8 text-center animate-fadeInUp">
        <i class="fas fa-check-circle text-6xl text-green-500 mb-4"></i>
        <h1 class="text-3xl font-bold mb-4">Password Reset Complete</h1>
        <p class="text-gray-400 mb-6">Your password has been successfully reset. You can now log in with your new password.</p>
        <a href="{% url 'login' %}" class="inline-block bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 px-6 py-2 rounded-lg transition">
            <i class="fas fa-sign-in-alt mr-2"></i> Login Now
        </a>
    </div>
</div>
{% endblock %}
